<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
            outline: none;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .code-display {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }
        
        .code {
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 15px;
            color: #333;
            margin: 20px 0;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-width: 800px;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px 15px 0 0;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 70%;
        }
        
        .my-message {
            margin-left: auto;
            text-align: right;
        }
        
        .their-message {
            margin-right: auto;
        }
        
        .message-content {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 20px;
        }
        
        .my-message .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .their-message .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 5px;
        }
        
        .message-input {
            display: flex;
            padding: 20px;
            background: white;
            border-radius: 0 0 15px 15px;
            border-top: 1px solid #ddd;
        }
        
        .message-input input {
            flex: 1;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="app" class="container">
        <!-- Content will be loaded here by JavaScript -->
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io('http://localhost:5000');
        let currentRoom = '';
        let username = '';
        let otherUser = '';
        let messages = [];

        function showScreen(screen, data = {}) {
            let html = '';
            
            if (screen === 'home') {
                html = `
                    <h1>🔐 Secure Chat</h1>
                    <div class="error" id="error"></div>
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Enter your name" autocomplete="off">
                    </div>
                    <button class="btn" onclick="goToCreate()">Create New Room</button>
                    <div style="text-align: center; margin: 20px; color: #666;">or</div>
                    <button class="btn btn-secondary" onclick="showScreen('join')">Join with Code</button>
                `;
            }
            
            else if (screen === 'create') {
                html = `
                    <h1>Create Room</h1>
                    <div class="input-group">
                        <input type="text" id="createName" placeholder="Your name" value="${username}" autocomplete="off">
                    </div>
                    <button class="btn" onclick="createRoom()" id="createBtn">Generate 6-Digit Code</button>
                    <button class="btn btn-secondary" onclick="showScreen('home')">Back</button>
                `;
            }
            
            else if (screen === 'join') {
                html = `
                    <h1>Join Room</h1>
                    <div class="error" id="joinError"></div>
                    <div class="input-group">
                        <input type="text" id="joinName" placeholder="Your name" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <input type="text" id="roomCode" placeholder="6-digit code" maxlength="6" autocomplete="off" style="text-align: center; letter-spacing: 10px;">
                    </div>
                    <button class="btn" onclick="joinRoom()">Join Room</button>
                    <button class="btn btn-secondary" onclick="showScreen('home')">Back</button>
                `;
            }
            
            else if (screen === 'waiting') {
                html = `
                    <h1>Room Created! 🎉</h1>
                    <p style="text-align: center; color: #666; margin-bottom: 20px;">Share this code with one person:</p>
                    <div class="code-display">
                        <div class="code">${currentRoom}</div>
                        <p style="color: #666;">First person to use this code can join</p>
                    </div>
                    <p style="text-align: center; color: #666; margin: 20px 0;">Waiting for someone to join...</p>
                    <button class="btn" onclick="copyCode()">📋 Copy Code</button>
                    <button class="btn btn-secondary" onclick="location.reload()">Cancel</button>
                `;
            }
            
            else if (screen === 'chat') {
                html = `
                    <div class="chat-container">
                        <div class="chat-header">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <h2 style="margin: 0;">Room: ${currentRoom}</h2>
                                    <p style="margin: 5px 0 0 0; opacity: 0.9;">You: ${username} | Other: ${otherUser || '...'}</p>
                                </div>
                                <button onclick="location.reload()" style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer;">Leave</button>
                            </div>
                        </div>
                        
                        <div class="messages" id="messages">
                            ${messages.map(msg => `
                                <div class="message ${msg.username === username ? 'my-message' : 'their-message'}">
                                    <div class="message-content">
                                        <div style="font-weight: bold; font-size: 14px; margin-bottom: 5px;">${msg.username}</div>
                                        <div>${msg.text}</div>
                                        <div style="font-size: 12px; opacity: 0.7; margin-top: 5px;">
                                            ${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="message-input">
                            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendMessage()">
                            <button class="btn" onclick="sendMessage()" style="width: auto; padding: 15px 30px;">Send</button>
                        </div>
                    </div>
                `;
            }
            
            document.getElementById('app').innerHTML = html;
            
            // Scroll to bottom in chat
            if (screen === 'chat') {
                setTimeout(() => {
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 100);
            }
        }

        function showError(message, type = 'general') {
            const errorDiv = document.getElementById(type === 'join' ? 'joinError' : 'error');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        function goToCreate() {
            username = document.getElementById('username').value.trim();
            if (username.length < 2) {
                showError('Name must be at least 2 characters');
                return;
            }
            showScreen('create');
        }

        async function createRoom() {
            username = document.getElementById('createName').value.trim();
            if (username.length < 2) {
                showError('Name must be at least 2 characters');
                return;
            }
            
            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            btn.textContent = 'Generating...';
            
            try {
                const response = await fetch('http://localhost:5000/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    btn.disabled = false;
                    btn.textContent = 'Generate 6-Digit Code';
                } else {
                    currentRoom = data.code;
                    showScreen('waiting');
                    
                    // 🔥 CRITICAL FIX 1: Connect to Socket.io immediately
                    socket.emit('join-chat', { code: currentRoom, username: username });
                    
                    // 🔥 CRITICAL FIX 2: Set up socket listeners for creator
                    setupSocketListenersForCreator();
                }
            } catch (error) {
                showError('Failed to create room. Make sure backend is running.');
                btn.disabled = false;
                btn.textContent = 'Generate 6-Digit Code';
            }
        }

        async function joinRoom() {
            username = document.getElementById('joinName').value.trim();
            const code = document.getElementById('roomCode').value.trim();
            
            if (username.length < 2) {
                showError('Name must be at least 2 characters', 'join');
                return;
            }
            
            if (code.length !== 6) {
                showError('Enter a valid 6-digit code', 'join');
                return;
            }
            
            try {
                // 1. Join via API
                const response = await fetch('http://localhost:5000/api/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, username })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error, 'join');
                } else {
                    currentRoom = code;
                    otherUser = data.creator;
                    
                    // 🔥 CRITICAL FIX 3: Connect to Socket.io room
                    socket.emit('join-chat', { code: currentRoom, username: username });
                    
                    // 🔥 CRITICAL FIX 4: Set up socket listeners for joiner
                    setupSocketListenersForJoiner();
                    
                    // 🔥 CRITICAL FIX 5: Show chat screen immediately
                    showScreen('chat');
                }
            } catch (error) {
                showError('Failed to join room. Check code and connection.', 'join');
            }
        }

        // 🔥 NEW FUNCTION: Setup for creator (waits for joiner)
        function setupSocketListenersForCreator() {
            // Clear previous listeners
            socket.off('user-joined');
            socket.off('chat-history');
            socket.off('new-message');
            
            // When someone joins the room
            socket.on('user-joined', (user) => {
                console.log('User joined creator room:', user);
                if (user !== username) {
                    otherUser = user;
                    showScreen('chat'); // Switch to chat when joiner arrives
                }
            });
            
            // Receive chat history
            socket.on('chat-history', (history) => {
                messages = history;
                if (document.getElementById('messages')) {
                    showScreen('chat');
                }
            });
            
            // Receive new messages
            socket.on('new-message', (message) => {
                messages.push(message);
                if (document.getElementById('messages')) {
                    showScreen('chat');
                }
            });
        }

        // 🔥 NEW FUNCTION: Setup for joiner (immediate chat)
        function setupSocketListenersForJoiner() {
            // Clear previous listeners
            socket.off('user-joined');
            socket.off('chat-history');
            socket.off('new-message');
            
            // Receive chat history immediately
            socket.on('chat-history', (history) => {
                messages = history;
                if (document.getElementById('messages')) {
                    showScreen('chat');
                }
            });
            
            // Receive new messages
            socket.on('new-message', (message) => {
                messages.push(message);
                if (document.getElementById('messages')) {
                    showScreen('chat');
                }
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            // Send via socket
            socket.emit('send-message', { text: text });
            
            // Clear input
            input.value = '';
            input.focus();
        }

        function copyCode() {
            navigator.clipboard.writeText(currentRoom);
            alert('✅ Code copied to clipboard!');
        }

        // Start with home screen
        showScreen('home');
        
        // Auto-focus username input
        setTimeout(() => {
            const userInput = document.getElementById('username');
            if (userInput) userInput.focus();
        }, 100);
    </script>
</body>
</html>
